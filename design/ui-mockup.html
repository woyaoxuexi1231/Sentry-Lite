<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sentry-Lite · Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #eef0f4;
      --surface: #ffffff;
      --surface2: #f6f7f9;
      --border: #e4e7ee;
      --text: #171717;
      --muted: #737373;
      /* 语义色唯一来源 — 与 Uptime 条一致 */
      --ok: #10b981;
      --warn: #fbbf24;
      --crit: #f87171;
      --ok-bg: rgba(16, 185, 129, 0.14);
      --warn-bg: rgba(251, 191, 36, 0.18);
      --crit-bg: rgba(248, 113, 113, 0.16);
      --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --r-xl: 28px;
      --r-lg: 20px;
      --r-md: 14px;
      --shadow: 0 16px 48px rgba(18, 21, 26, 0.07), 0 2px 8px rgba(18, 21, 26, 0.04);
      --shadow-sm: 0 2px 8px rgba(18, 21, 26, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding: 32px 20px;
    }

    .app {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 28px 36px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .brand h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.025em;
    }

    .brand .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 8px var(--ok);
      animation: pulse 2s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .brand span {
      font-size: 13px;
      color: var(--muted);
    }

    .actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .btn {
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: var(--r-md);
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      cursor: pointer;
      transition: 0.15s;
    }

    .btn:hover { color: var(--text); border-color: #cfd4de; background: #fff; }

    .range {
      display: flex;
      gap: 3px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 4px;
    }

    .range button {
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      padding: 7px 12px;
      border: none;
      background: transparent;
      color: var(--muted);
      border-radius: var(--r-md);
      cursor: pointer;
      transition: 0.12s;
    }

    .range button.on {
      background: #fff;
      color: var(--text);
      box-shadow: var(--shadow-sm);
    }

    .live {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    @media (max-width: 640px) {
      .live { grid-template-columns: repeat(2, 1fr); }
    }

    .live-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 18px 20px;
    }

    .live-card .label {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .live-card .value {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      transition: color 0.15s;
    }

    .live-card .sub {
      font-size: 13px;
      margin-top: 6px;
      font-variant-numeric: tabular-nums;
      transition: color 0.15s;
    }

    /* 全站语义色 = Uptime 条三色，禁止其它色值 */
    .sev-ok { color: var(--ok) !important; }
    .sev-warn { color: var(--warn) !important; }
    .sev-crit { color: var(--crit) !important; }

    .live-card .sub.neutral { color: var(--muted) !important; }

    .live-card.net .value { font-size: 22px; }
    .live-card.net .sub { font-size: 12px; }

    .panel {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 20px 22px;
      margin-bottom: 14px;
      position: relative;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
    }

    .panel-head h2 {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
    }

    .panel-head .score {
      font-size: 14px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .status-score,
    .status-label {
      transition: color 0.15s;
    }

    .bars {
      display: flex;
      gap: 3px;
      height: 34px;
    }

    .bar {
      flex: 1;
      border-radius: 999px;
      min-width: 0;
      cursor: crosshair;
      transition: transform 0.12s ease, opacity 0.12s;
    }

    .bar.ok { background: var(--ok); }
    .bar.warn { background: var(--warn); }
    .bar.crit { background: var(--crit); }

    .bar:hover, .bar.on {
      transform: scaleY(1.12);
      opacity: 0.88;
    }

    .bar-axis {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    /* uptime popup */
    .bar-tip {
      display: none;
      position: absolute;
      z-index: 20;
      padding: 16px 18px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      pointer-events: none;
      min-width: 260px;
      box-shadow: var(--shadow);
    }

    .bar-tip.show { display: block; }

    .bar-tip .time {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .bar-tip .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .bar-tip .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    .bar-tip .status-dot.ok { background: var(--ok); }
    .bar-tip .status-dot.warn { background: var(--warn); }
    .bar-tip .status-dot.crit { background: var(--crit); }

    .bar-tip .status-label {
      font-size: 14px;
      font-weight: 600;
    }

    .bar-tip .status-score {
      margin-left: auto;
      font-size: 14px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .bar-tip .metrics {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .bar-tip .metric-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
    }

    .bar-tip .metric-row .k {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      flex-shrink: 0;
    }

    .bar-tip .metric-row .dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      flex-shrink: 0;
      background: var(--muted);
      opacity: 0.45;
    }

    .bar-tip .metric-row .vals {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .pill {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      line-height: 1.3;
    }

    .pill.ok {
      background: var(--ok-bg);
      color: var(--ok);
    }

    .pill.warn {
      background: var(--warn-bg);
      color: var(--warn);
    }

    .pill.crit {
      background: var(--crit-bg);
      color: var(--crit);
    }

    .pill.neutral {
      background: rgba(115, 115, 115, 0.1);
      color: var(--text);
    }

    .bar-tip .legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .bar-tip .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--muted);
    }

    .bar-tip .legend-item .swatch {
      width: 8px;
      height: 8px;
      border-radius: 999px;
    }

    .stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .stat {
      font-size: 13px;
      color: var(--muted);
      padding: 10px 14px;
      font-variant-numeric: tabular-nums;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
    }

    .stat b { font-weight: 600; }

    .stat .v { font-weight: 600; }

    .foot {
      margin-top: 18px;
      font-size: 13px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div class="app">

    <header class="header">
      <div class="brand">
        <div class="dot"></div>
        <h1>Dashboard</h1>
        <span>Sentry-Lite</span>
      </div>
      <div class="actions">
        <div class="range">
          <button type="button">15m</button>
          <button type="button" class="on">1h</button>
          <button type="button">6h</button>
          <button type="button">24h</button>
          <button type="button">7d</button>
        </div>
        <button class="btn" type="button">Export CSV</button>
        <button class="btn" type="button">Retention</button>
      </div>
    </header>

    <section class="live">
      <div class="live-card cpu">
        <div class="label">CPU</div>
        <div class="value" id="liveCpu">32%</div>
        <div class="sub" id="liveCpuT">78°C</div>
      </div>
      <div class="live-card gpu">
        <div class="label">GPU</div>
        <div class="value" id="liveGpu">16%</div>
        <div class="sub" id="liveGpuT">71°C</div>
      </div>
      <div class="live-card ram">
        <div class="label">RAM</div>
        <div class="value" id="liveRam">85%</div>
        <div class="sub" id="liveRamSub">13.6 / 16 GB</div>
      </div>
      <div class="live-card net">
        <div class="label">NET</div>
        <div class="value" id="liveDn">840 KB/s</div>
        <div class="sub" id="liveUp">↑ 12 B/s</div>
      </div>
    </section>

    <section class="panel" id="healthPanel">
      <div class="panel-head">
        <h2>Uptime</h2>
        <span class="score" id="healthScore">99.1%</span>
      </div>
      <div class="bars" id="bars"></div>
      <div class="bar-axis"><span>1 hour ago</span><span>Today</span></div>

      <div class="bar-tip" id="barTip">
        <div class="time" id="btTime">—</div>
        <div class="status-row">
          <span class="status-dot ok" id="btDot"></span>
          <span class="status-label" id="btLabel">Healthy</span>
          <span class="status-score" id="btScore">—</span>
        </div>
        <div class="metrics">
          <div class="metric-row">
            <span class="k"><span class="dot"></span>CPU</span>
            <span class="vals" id="btCpuVals"></span>
          </div>
          <div class="metric-row">
            <span class="k"><span class="dot"></span>GPU</span>
            <span class="vals" id="btGpuVals"></span>
          </div>
          <div class="metric-row">
            <span class="k"><span class="dot"></span>RAM</span>
            <span class="vals" id="btRamVals"></span>
          </div>
          <div class="metric-row">
            <span class="k"><span class="dot"></span>NET</span>
            <span class="vals" id="btNetVals"></span>
          </div>
        </div>
        <div class="legend">
          <span class="legend-item"><span class="swatch" style="background:var(--ok)"></span>Healthy</span>
          <span class="legend-item"><span class="swatch" style="background:var(--warn)"></span>Degraded</span>
          <span class="legend-item"><span class="swatch" style="background:var(--crit)"></span>Critical</span>
        </div>
      </div>
    </section>

    <div class="stats">
      <div class="stat" id="statCpu"></div>
      <div class="stat" id="statGpu"></div>
      <div class="stat" id="statRam"></div>
    </div>

    <footer class="foot">
      <span>3,600 samples</span>
      <span id="clock">—</span>
    </footer>
  </div>

  <script>
    const N = 240;
    const rng = s => { const x = Math.sin(s * 777.1) * 9999; return x - Math.floor(x); };

    function series(base, amp, freq, spike) {
      const a = [];
      for (let i = 0; i < N; i++) {
        const t = i / (N - 1);
        let v = base + Math.sin(t * Math.PI * 2 * freq) * amp + (rng(i) - 0.5) * amp * 0.2;
        if (spike && t > spike) v += amp * 1.4 * Math.sin((t - spike) / (1 - spike) * Math.PI);
        a.push(Math.max(0, v));
      }
      for (let p = 0; p < 4; p++)
        for (let i = 1; i < N - 1; i++) a[i] = a[i-1]*0.25 + a[i]*0.5 + a[i+1]*0.25;
      return a;
    }

    const data = {
      cpu: series(28, 14, 1.3, 0.74),
      gpu: series(12, 7, 1.0, 0.8),
      ram: series(84, 2.5, 0.5, null),
      // higher temps so warn/crit pills actually show
      cpuT: series(74, 14, 1.1, 0.74),
      gpuT: series(68, 12, 0.9, 0.8),
      dn:  series(420, 180, 1.6, 0.55),
      up:  series(14, 8, 2.0, null),
    };

    const THRESH = {
      pct: { warn: 70, crit: 90 },
      ram: { warn: 80, crit: 90 },
      temp: { warn: 75, crit: 85 },
    };

    function sevPct(v, kind = "pct") {
      const t = THRESH[kind] || THRESH.pct;
      if (v >= t.crit) return "crit";
      if (v >= t.warn) return "warn";
      return "ok";
    }

    function sevTemp(v) {
      if (v >= THRESH.temp.crit) return "crit";
      if (v >= THRESH.temp.warn) return "warn";
      return "ok";
    }

    function pill(text, sev) {
      return `<span class="pill ${sev}">${text}</span>`;
    }

    function setPills(id, items) {
      document.getElementById(id).innerHTML = items.join("");
    }

    function sevClass(sev) {
      return "sev-" + sev;
    }

    function uptimeLevel(okRatio) {
      if (okRatio >= 85) return "ok";
      if (okRatio >= 65) return "warn";
      return "crit";
    }

    function setScoreText(el, text, level) {
      el.textContent = text;
      const base = el.id === "healthScore" ? "score" : "status-score";
      el.className = base + " " + sevClass(level);
    }

    function valSpan(v, sev) {
      return `<span class="v ${sevClass(sev)}">${v}</span>`;
    }

    function setLiveMetric(el, text, sev, neutral) {
      el.textContent = text;
      if (neutral) {
        el.className = "sub neutral";
        return;
      }
      const isSub = el.id.endsWith("T") || el.id === "liveRamSub";
      el.className = (isSub ? "sub" : "value") + " " + sevClass(sev);
    }

    function computePeriodStats() {
      const max = arr => Math.max(...arr);
      const mean = arr => arr.reduce((s, v) => s + v, 0) / arr.length;
      return {
        cpu: { max: max(data.cpu), avg: mean(data.cpu), maxT: max(data.cpuT), avgT: mean(data.cpuT) },
        gpu: { max: max(data.gpu), avg: mean(data.gpu), maxT: max(data.gpuT), avgT: mean(data.gpuT) },
        ram: { max: max(data.ram), avg: mean(data.ram) },
      };
    }

    function renderStats(s, prefix = "") {
      const p = prefix ? prefix + " " : "";
      document.getElementById("statCpu").innerHTML =
        `CPU  ${p}max ${valSpan(Math.round(s.cpu.max) + "%", sevPct(s.cpu.max))}` +
        ` / ${valSpan(Math.round(s.cpu.maxT) + "°C", sevTemp(s.cpu.maxT))}` +
        `  avg ${valSpan(Math.round(s.cpu.avg) + "%", sevPct(s.cpu.avg))}` +
        ` / ${valSpan(Math.round(s.cpu.avgT) + "°C", sevTemp(s.cpu.avgT))}`;

      document.getElementById("statGpu").innerHTML =
        `GPU  ${p}max ${valSpan(Math.round(s.gpu.max) + "%", sevPct(s.gpu.max))}` +
        ` / ${valSpan(Math.round(s.gpu.maxT) + "°C", sevTemp(s.gpu.maxT))}` +
        `  avg ${valSpan(Math.round(s.gpu.avg) + "%", sevPct(s.gpu.avg))}` +
        ` / ${valSpan(Math.round(s.gpu.avgT) + "°C", sevTemp(s.gpu.avgT))}`;

      document.getElementById("statRam").innerHTML =
        `RAM  ${p}max ${valSpan(Math.round(s.ram.max) + "%", sevPct(s.ram.max, "ram"))}` +
        `  avg ${valSpan(Math.round(s.ram.avg) + "%", sevPct(s.ram.avg, "ram"))}`;
    }

    function bucketToStats(b) {
      return {
        cpu: { max: b.cpuA, avg: b.cpuA, maxT: b.cpuTA, avgT: b.cpuTA },
        gpu: { max: b.gpuA, avg: b.gpuA, maxT: b.gpuTA, avgT: b.gpuTA },
        ram: { max: b.ramA, avg: b.ramA },
      };
    }

    function applyLive(cpu, gpu, ram, cpuT, gpuT, dn, up) {
      setLiveMetric(document.getElementById("liveCpu"), Math.round(cpu) + "%", sevPct(cpu));
      setLiveMetric(document.getElementById("liveGpu"), Math.round(gpu) + "%", sevPct(gpu));
      setLiveMetric(document.getElementById("liveRam"), Math.round(ram) + "%", sevPct(ram, "ram"));
      setLiveMetric(document.getElementById("liveCpuT"), Math.round(cpuT) + "°C", sevTemp(cpuT));
      setLiveMetric(document.getElementById("liveGpuT"), Math.round(gpuT) + "°C", sevTemp(gpuT));
      setLiveMetric(document.getElementById("liveRamSub"), (ram * 0.16).toFixed(1) + " / 16 GB", sevPct(ram, "ram"));
      setLiveMetric(document.getElementById("liveDn"), fmtDn(dn), "ok");
      setLiveMetric(document.getElementById("liveUp"), "↑ " + Math.round(up) + " B/s", "ok", true);
    }

    function fmtDn(v) {
      return v >= 1024 ? (v / 1024).toFixed(1) + " MB/s" : Math.round(v) + " KB/s";
    }

    let periodStats = computePeriodStats();
    renderStats(periodStats);
    applyLive(32, 16, 85, 78, 71, 840, 12);

    const STATUS = {
      ok:   { label: "Healthy" },
      warn: { label: "Degraded" },
      crit: { label: "Critical" },
    };

    const B = 48, buckets = [];
    const barsEl = document.getElementById("bars");
    const avg = (arr, a, z) => arr.slice(a, z).reduce((s, v) => s + v, 0) / Math.max(1, z - a);

    for (let i = 0; i < B; i++) {
      const a = Math.floor(i / B * N), z = Math.floor((i + 1) / B * N);
      const cpuA = avg(data.cpu, a, z), gpuA = avg(data.gpu, a, z);
      const ramA = avg(data.ram, a, z), dnA = avg(data.dn, a, z);
      const upA = avg(data.up, a, z);
      const cpuTA = avg(data.cpuT, a, z), gpuTA = avg(data.gpuT, a, z);
      let score = 100 - Math.max(0, cpuA - 55) * 0.8 - Math.max(0, gpuA - 45) * 0.5 - Math.max(0, ramA - 90) * 2;
      if (cpuTA >= THRESH.temp.warn) score -= 8;
      if (gpuTA >= THRESH.temp.warn) score -= 5;
      if (cpuTA >= THRESH.temp.crit) score -= 12;
      if (gpuTA >= THRESH.temp.crit) score -= 8;
      // a few hot buckets for demo
      if (i === 18 || i === 19) { score = 72; }
      if (i === 22 || i === 35) score = 76;
      if (i === 40 || i === 41) score = 52;
      score = Math.max(40, Math.min(100, score));
      const level = score < 65 ? "crit" : score < 85 ? "warn" : "ok";
      buckets.push({ score, level, cpuA, gpuA, ramA, dnA, upA, cpuTA, gpuTA });
      const el = document.createElement("div");
      el.className = "bar " + level;
      el.dataset.i = i;
      barsEl.appendChild(el);
    }

    const okRatio = buckets.filter(b => b.level === "ok").length / B * 100;
    setScoreText(document.getElementById("healthScore"), okRatio.toFixed(1) + "%", uptimeLevel(okRatio));

    const barTip = document.getElementById("barTip");
    const healthPanel = document.getElementById("healthPanel");

    barsEl.addEventListener("mousemove", e => {
      const bar = e.target.closest(".bar");
      if (!bar) return;

      barsEl.querySelectorAll(".bar").forEach(b => b.classList.remove("on"));
      bar.classList.add("on");

      const b = buckets[+bar.dataset.i];
      const st = STATUS[b.level];
      const mins = Math.round((1 - +bar.dataset.i / B) * 60);

      document.getElementById("btTime").textContent = mins === 0 ? "Now" : mins + " min ago";

      const dot = document.getElementById("btDot");
      dot.className = "status-dot " + b.level;
      document.getElementById("btLabel").textContent = st.label;
      document.getElementById("btLabel").className = "status-label " + sevClass(b.level);
      setScoreText(document.getElementById("btScore"), Math.round(b.score) + "%", b.level);

      setPills("btCpuVals", [
        pill(Math.round(b.cpuA) + "% avg", sevPct(b.cpuA)),
        pill(Math.round(b.cpuTA) + "°C avg", sevTemp(b.cpuTA)),
      ]);
      setPills("btGpuVals", [
        pill(Math.round(b.gpuA) + "% avg", sevPct(b.gpuA)),
        pill(Math.round(b.gpuTA) + "°C avg", sevTemp(b.gpuTA)),
      ]);
      setPills("btRamVals", [
        pill(Math.round(b.ramA) + "% avg", sevPct(b.ramA, "ram")),
      ]);
      setPills("btNetVals", [
        pill(fmtDn(b.dnA) + " dl", "ok"),
        pill("↑ " + Math.round(b.upA) + " B/s", "neutral"),
      ]);

      applyLive(b.cpuA, b.gpuA, b.ramA, b.cpuTA, b.gpuTA, b.dnA, b.upA);
      renderStats(bucketToStats(b), "now");

      barTip.classList.add("show");
      const hr = healthPanel.getBoundingClientRect();
      const br = bar.getBoundingClientRect();
      const tw = barTip.offsetWidth || 220;
      let left = br.left - hr.left + br.width / 2 - tw / 2;
      left = Math.max(4, Math.min(left, hr.width - tw - 4));
      barTip.style.left = left + "px";
      barTip.style.bottom = hr.height - (br.top - hr.top) + 10 + "px";
    });

    barsEl.addEventListener("mouseleave", () => {
      barTip.classList.remove("show");
      barsEl.querySelectorAll(".bar").forEach(b => b.classList.remove("on"));
      // restore live defaults
      applyLive(32, 16, 85, 78, 71, 840, 12);
      renderStats(periodStats);
    });

    function tick() {
      document.getElementById("clock").textContent =
        new Date().toLocaleTimeString("en-GB", { hour12: false });
    }
    tick();
    setInterval(tick, 1000);

    document.querySelectorAll(".range button").forEach(b => {
      b.addEventListener("click", () => {
        document.querySelectorAll(".range button").forEach(x => x.classList.remove("on"));
        b.classList.add("on");
      });
    });
  </script>
</body>
</html>
