name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v1.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            '${{ github.event.inputs.tag }}'
          } else {
            '${{ github.ref_name }}'
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Tag must look like v1.0.0, got: $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = "${{ steps.ver.outputs.version }}"
          $root = "dist/Sentry-Lite-$ver-x64"
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          # Locate build outputs (Ninja -> build/, VS multi-config -> build/Release)
          $bin = if (Test-Path "build/Sentry-Lite.exe") { "build" }
                 elseif (Test-Path "build/Release/Sentry-Lite.exe") { "build/Release" }
                 else { throw "Sentry-Lite.exe not found under build/" }

          Copy-Item "$bin/Sentry-Lite.exe" "$root/Sentry-Lite.exe"

          # LHM bridge + runtimeconfig/deps
          foreach ($f in @(
            "Sentry-Lite-lhm.dll",
            "Sentry-Lite-lhm.runtimeconfig.json",
            "Sentry-Lite-lhm.deps.json"
          )) {
            if (Test-Path "$bin/$f") { Copy-Item "$bin/$f" "$root/" }
          }

          # Managed deps next to the exe (framework-dependent)
          Get-ChildItem "$bin" -Filter "*.dll" -File | ForEach-Object {
            Copy-Item $_.FullName "$root/" -Force
          }

          # Prefer Windows RID AccessControl (avoids MutexAccessRule null-identity crash)
          $winAc = "$bin/runtimes/win/lib/net8.0/System.Threading.AccessControl.dll"
          if (Test-Path $winAc) {
            Copy-Item $winAc "$root/System.Threading.AccessControl.dll" -Force
          }

          if (Test-Path "$bin/web") {
            Copy-Item -Recurse "$bin/web" "$root/web"
          }

          # Required files check
          foreach ($need in @("Sentry-Lite.exe", "Sentry-Lite-lhm.dll", "Sentry-Lite-lhm.runtimeconfig.json", "web/dashboard.html")) {
            if (-not (Test-Path "$root/$need")) { throw "Missing required package file: $need" }
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = "dist/Sentry-Lite-$ver-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $root -DestinationPath $zip -Force

          # Standalone exe asset (same binary as inside the zip)
          Copy-Item "$root/Sentry-Lite.exe" "dist/Sentry-Lite-$ver-x64.exe" -Force

          # Only upload zip + exe (not the unpacked folder)
          Remove-Item $root -Recurse -Force

          Get-ChildItem dist | Format-Table Name, Length

      - name: Resolve release notes
        id: notes
        shell: pwsh
        run: |
          $path = "RELEASE_v${{ steps.ver.outputs.version }}.md"
          if (Test-Path $path) {
            "body_path=$path" >> $env:GITHUB_OUTPUT
          }

      - name: Publish GitHub Release
        if: steps.notes.outputs.body_path != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Sentry-Lite ${{ steps.ver.outputs.version }}
          body_path: ${{ steps.notes.outputs.body_path }}
          files: |
            dist/Sentry-Lite-*.zip
            dist/Sentry-Lite-*.exe
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

      - name: Publish GitHub Release (auto notes)
        if: steps.notes.outputs.body_path == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Sentry-Lite ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/Sentry-Lite-*.zip
            dist/Sentry-Lite-*.exe
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
