name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            '${{ github.event.inputs.tag }}'
          } else {
            '${{ github.ref_name }}'
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Tag must look like v1.0.0, got: $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $ver = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist/Sentry-Lite-$ver-x64 | Out-Null
          Copy-Item "build/Sentry-Lite.exe" "dist/Sentry-Lite-$ver-x64/Sentry-Lite.exe"
          Copy-Item "build/Sentry-Lite-lhm.dll" "dist/Sentry-Lite-$ver-x64/" -ErrorAction SilentlyContinue
          Copy-Item "build/Sentry-Lite-lhm.runtimeconfig.json" "dist/Sentry-Lite-$ver-x64/" -ErrorAction SilentlyContinue
          Copy-Item "build/Sentry-Lite-lhm.deps.json" "dist/Sentry-Lite-$ver-x64/" -ErrorAction SilentlyContinue
          Copy-Item "build/LibreHardwareMonitorLib.dll" "dist/Sentry-Lite-$ver-x64/" -ErrorAction SilentlyContinue
          Copy-Item "build/HidSharp.dll" "dist/Sentry-Lite-$ver-x64/" -ErrorAction SilentlyContinue
          Copy-Item "build/*.dll" "dist/Sentry-Lite-$ver-x64/" -ErrorAction SilentlyContinue
          if (Test-Path "build/web") { Copy-Item -Recurse "build/web" "dist/Sentry-Lite-$ver-x64/web" }
          Compress-Archive -Path "dist/Sentry-Lite-$ver-x64" -DestinationPath "dist/Sentry-Lite-$ver-x64.zip"

      - name: Resolve release notes
        id: notes
        shell: pwsh
        run: |
          $path = "RELEASE_v${{ steps.ver.outputs.version }}.md"
          if (Test-Path $path) {
            "body_path=$path" >> $env:GITHUB_OUTPUT
          }

      - name: Publish GitHub Release
        if: steps.notes.outputs.body_path != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Sentry-Lite ${{ steps.ver.outputs.version }}
          body_path: ${{ steps.notes.outputs.body_path }}
          files: dist/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

      - name: Publish GitHub Release (auto notes)
        if: steps.notes.outputs.body_path == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Sentry-Lite ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: dist/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
